<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoria | Ray Labra</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <!-- Same-origin copy served from this repo (/estoria/), not the github.io
         site: a cross-origin iframe cannot show the File System Access folder
         picker (Estoria's Back up), and no allow token can delegate it.
         Update the copy with `npm run sync:portfolio` in the estoria repo. -->
    <iframe
        src="/estoria/"
        title="Estoria | Visual Story-Mapping Tool for Novelists"
        allow="clipboard-write; clipboard-read"
        allowfullscreen
    ></iframe>
</body>
</html>
